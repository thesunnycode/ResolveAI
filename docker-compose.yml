# ResolveAI local development stack
#
#   docker compose up -d            bring everything up
#   docker compose down -v          tear down INCLUDING volumes (the real test)
#   docker compose ps               health status
#
# The `app` service is deliberately commented out until Phase 6A / doc 13 Task E1.
# Until then the Spring app runs from IntelliJ on :8080 and Prometheus scrapes the
# host via host.docker.internal.

name: resolveai

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # pgvector/pgvector:pg16 — NOT postgres:16. The plain image does not ship the
  # vector extension and you would not find out until Phase 6.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resolveai
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai_local
      # Deterministic collation so ORDER BY is stable across machines
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # 55432 on the host, not 5432. A native Windows PostgreSQL service already binds 5432,
      # and when two processes listen on one port the client reaches whichever bound first -
      # which produced "password authentication failed for user resolveai" against a server
      # that had simply never heard of that role. Inside the compose network the port is
      # still 5432; only the host mapping moved.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on first creation so `down -v && up` yields a ready database
      # without a manual psql step.
      - ./ops/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────────
  # appendonly no — this is a cache and a lock store, not a datastore. Nothing
  # in ResolveAI may depend on Redis surviving a restart (see doc 03 §4.4).
  redis:
    image: redis:7-alpine
    container_name: resolveai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    # NOTE: MinIO withdrew their Docker Hub images in 2025 — quay.io is the
    # supported registry. Using docker.io/minio/minio fails with 'pull access denied'.
    image: quay.io/minio/minio:latest
    container_name: resolveai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: resolveai
      MINIO_ROOT_PASSWORD: resolveai_local
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Creates the attachments bucket on first boot so Task 4 does not need a
  # manual console step. Runs once and exits.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: resolveai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 resolveai resolveai_local &&
      mc mb --ignore-existing local/resolveai-attachments &&
      echo 'bucket resolveai-attachments ready'
      "
    restart: "no"

  # ── Mailhog (SMTP sink) ───────────────────────────────────────────────────
  # No healthcheck: the image is minimal and has no shell tooling worth relying on.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: resolveai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    logging:
      driver: none    # mailhog is extremely chatty

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: resolveai-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets Prometheus scrape the Spring app running on the HOST from IntelliJ.
      # Required on Linux; harmless on Windows/macOS where it already resolves.
      - "host.docker.internal:host-gateway"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: resolveai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Ollama (local model for the external_model_allowed=false path) ────────
  # Pull the model in Task 6:
  #   docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    container_name: resolveai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Application ───────────────────────────────────────────────────────────
  # Enabled in Phase 6A (doc 13 Task E1) once the Dockerfile exists.
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: resolveai-app
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     SPRING_PROFILES_ACTIVE: local
  #     DATABASE_URL: jdbc:postgresql://postgres:5432/resolveai
  #     REDIS_URL: redis://redis:6379
  #     S3_ENDPOINT: http://minio:9000
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }
  #     minio:    { condition: service_healthy }
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 40s

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  ollama-data:
