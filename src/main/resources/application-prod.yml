# Production.
#
# **Every value here reads from the environment with no default.** That is the whole point of
# this file. A default in a production profile is a value that silently applies when the
# deployment forgot to set it — and the ones that matter are precisely the ones you most want
# to fail loudly: the JWT secret, the database password, the PII encryption key.
#
# `${VAR}` with no `:default` makes a missing variable a startup failure. A pod that refuses
# to start is an incident you notice in thirty seconds. A pod that starts with an empty
# signing key is an incident you notice much later, from someone else.

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      leak-detection-threshold: 30000
  data:
    redis:
      url: ${REDIS_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  ai:
    openai:
      api-key: ${LLM_PRIMARY_API_KEY}
      chat:
        options:
          model: ${LLM_PRIMARY_MODEL}
      embedding:
        options:
          model: ${EMBEDDING_MODEL}
          dimensions: 768

server:
  # Behind a reverse proxy. Without this, every request appears to originate from the proxy:
  # rate limiting keyed on client IP throttles the whole tenant as one caller, and the audit
  # trail records the load balancer as the actor.
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 2MB
    threads:
      # Default is 200. A demo dyno on a 512MB memory quota can't afford 200
      # pre-provisioned request-handling threads (~1MB stack each, worst case);
      # a single-tenant portfolio demo never sees enough concurrent requests
      # to need more than a handful.
      max: 20
      min-spare: 4

management:
  endpoints:
    web:
      exposure:
        # Narrower than local. `info` and the full health detail are not public information:
        # a version string tells an attacker which CVEs to try, and component health names
        # your internal dependencies.
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

resolveai:
  storage:
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  auth:
    jwt-secret: ${JWT_SECRET}
  security:
    pii-encryption-key: ${PII_ENCRYPTION_KEY}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    monthly-budget-micros: ${MONTHLY_TOKEN_BUDGET_MICROS}
    fallback:
      provider: ${LLM_FALLBACK_PROVIDER}
      api-key: ${LLM_FALLBACK_API_KEY}
      model: ${LLM_FALLBACK_MODEL}

logging:
  level:
    root: INFO
    com.resolveai: INFO
    # Never DEBUG in production: bound-parameter logging would write customer ticket bodies,
    # email addresses and PII placeholders into the log aggregator.
    org.hibernate.SQL: WARN
