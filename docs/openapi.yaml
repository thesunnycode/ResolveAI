  /tickets/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      operationId: assignTicket
      summary: Assign to self or to another agent
      description: |
        **This is the endpoint with the concurrency test behind it.** The claim is a
        conditional update with an affected-row check, not a `SELECT` followed by an `UPDATE`:

        ```sql
        UPDATE ticket
           SET assignee_id = :agentId, status = 'ASSIGNED', version = version + 1
         WHERE id = :ticketId AND assignee_id IS NULL;
        -- affected rows = 0 → someone else won → 409 ALREADY_ASSIGNED
        ```

        Two agents clicking "Assign to me" in the same millisecond produce exactly one `200`
        and one `409`. An integration test drives 20 concurrent requests and asserts exactly
        that distribution.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRequest' }
            examples:
              selfAssign:
                summary: Self-assign — omit the body entirely
                value: {}
              assignOther:
                summary: Lead assigning to a specific agent
                value: { assigneeId: 1207 }
              forceReassign:
                summary: Lead taking a ticket off another agent
                value: { assigneeId: 1207, force: true }
      responses:
        '200':
          description: Assigned. Returns the updated summary with a new ETag.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` — an AGENT assigning to someone other than themselves.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/TicketNotFound' }
        '409':
          description: '`ALREADY_ASSIGNED` (and `force` not set), or `VERSION_CONFLICT` (stale `If-Match`).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://resolveai.dev/errors/already-assigned
                title: Ticket already assigned
                status: 409
                errorCode: ALREADY_ASSIGNED
                detail: Ticket 88213 was assigned to Neha Kulkarni while you were looking at it.
                instance: /api/v1/tickets/88213/assign
                timestamp: '2026-09-20T10:58:00Z'
                traceId: 0af7651916cd43dd8448eb211c80319c
        '422':
          description: '`AGENT_AT_CAPACITY` — target agent is at `max_concurrent` or unavailable.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /tickets/{id}/status:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Tickets]
      operationId: changeStatus
      summary: Drive the ticket state machine
      description: |
        **Illegal transitions are rejected by the server, not prevented by the UI.** The
        permitted graph:

        ```
        OPEN                → TRIAGED, ASSIGNED, CLOSED
        TRIAGED             → ASSIGNED, CLOSED
        ASSIGNED            → IN_PROGRESS, WAITING_ON_CUSTOMER, PENDING_THIRD_PARTY, RESOLVED, OPEN
        IN_PROGRESS         → WAITING_ON_CUSTOMER, PENDING_THIRD_PARTY, RESOLVED, ASSIGNED
        WAITING_ON_CUSTOMER → IN_PROGRESS, RESOLVED, CLOSED          ← SLA clock PAUSES on entry
        PENDING_THIRD_PARTY → IN_PROGRESS, RESOLVED                  ← SLA clock PAUSES on entry
        RESOLVED            → CLOSED, OPEN
        CLOSED              → terminal; reopening goes through /reopen
        ```

        A rejection returns the **permitted targets** in `allowedTransitions`, so a client can
        recover without hard-coding the state machine.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStatusRequest' }
            example:
              status: WAITING_ON_CUSTOMER
              reason: Asked the customer for the UPI reference number.
      responses:
        '200':
          description: Transitioned. `slaEffect` reports any clock that paused or resumed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeResponse' }
              example:
                id: 88213
                status: WAITING_ON_CUSTOMER
                slaEffect:
                  resolution:
                    state: PAUSED
                    pausedAt: '2026-09-20T11:30:00Z'
                    reason: WAITING_ON_CUSTOMER
                    elapsedBusinessMinutesAtPause: 128
                _etag: W/"9"
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TicketNotFound' }
        '409':
          description: '`ILLEGAL_TRANSITION`, with the permitted targets; or `VERSION_CONFLICT`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/IllegalTransitionProblem' }
              example:
                type: https://resolveai.dev/errors/illegal-transition
                title: Illegal status transition
                status: 409
                errorCode: ILLEGAL_TRANSITION
                detail: Cannot move from CLOSED to IN_PROGRESS
                allowedTransitions: []
                instance: /api/v1/tickets/88213/status
                timestamp: '2026-09-20T11:30:00Z'
                traceId: 0af7651916cd43dd8448eb211c80319c

