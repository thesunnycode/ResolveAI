  # ════════════════════════════════════════════════════════════════════════════
  # TRIAGE & AI
  # ════════════════════════════════════════════════════════════════════════════

  /tickets/{id}/analysis:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Triage & AI]
      operationId: getAnalysis
      summary: Triage signals and their status — the resource POST /tickets points at
      description: |
        **`200`, never `404` or `503`, for the `UNAVAILABLE` case.** The analysis resource
        exists and its state is "we tried and failed". That is a successful read of a
        legitimate state, and the ticket remains fully workable. Returning an error status
        would make a degraded AI feature look like a broken API.

        **Note what the model returns and what it does not.** There is no `priority` field
        here. The model reports observations — category, impact, whether a payment is
        involved, how urgent the language is — and a versioned rule set turns those into a
        priority. See `GET /tickets/{id}/priority-rationale`.

        **`extractedEntities.orderRef` reads `«ORDER_1»`.** The order reference was
        PII-redacted before the text left for the model, so the model never saw the real
        value and the placeholder is what comes back. Rehydration happens only when rendering
        for an authorised human.
      responses:
        '200':
          description: The analysis resource, in whichever state it is in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResponse' }
              examples:
                processing:
                  summary: Still in flight
                  value:
                    ticketId: 88213
                    status: PROCESSING
                    enqueuedAt: '2026-09-20T09:22:05Z'
                    retryAfterSeconds: 3
                ready:
                  summary: Complete
                  value:
                    ticketId: 88213
                    status: READY
                    signals:
                      category: PAYMENT
                      reportedImpact: SINGLE_USER
                      serviceDownClaimed: false
                      dataLossClaimed: false
                      paymentAffected: true
                      linguisticUrgency: HIGH
                      extractedEntities:
                        paymentMethod: UPI
                        orderRef: «ORDER_1»
                    modelConfidence: 0.91
                    promptVersion: triage@7
                    modelId: gpt-4.1-mini
                    tokensIn: 1187
                    tokensOut: 168
                    costMicros: 412
                    latencyMs: 2840
                    completedAt: '2026-09-20T09:22:09Z'
                unavailable:
                  summary: Provider failed after retries — still a 200
                  value:
                    ticketId: 88213
                    status: UNAVAILABLE
                    reason: PROVIDER_ERROR
                    attempts: 3
                    lastError: upstream 503 after fallback
                    manualTriageRequired: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TicketNotFound' }

  /tickets/{id}/retriage:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [Triage & AI]
      operationId: retriage
      summary: Re-drive triage after a failure
      description: 'TODO: schema. No body. Enqueues a fresh outbox event; `409 TRIAGE_IN_PROGRESS` if one is already in flight.'
      responses:
        '202':
          description: Re-triage enqueued.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TicketNotFound' }
        '409':
